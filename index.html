<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0}[hidden]{display:none!important}</style>
<title>Механическое движение 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=PT+Sans:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: school graph-paper notebook — sticky header with RU/KZ + theme, tabbed lesson sections */
:root{
  --bg:#F3F6FB; --grid:rgba(36,87,214,.07); --surface:#FFFFFF; --surface2:#EAF0FA;
  --ink:#16223D; --muted:#56637E; --line:#D3DCEB;
  --accent:#2457D6; --accent-ink:#FFFFFF; --vec:#E0590E;
  --ok:#1E8C4E; --ok-bg:#E3F4EA; --bad:#C23A3A; --bad-bg:#FBE7E7;
  --sky:#DCE8FA; --ground:#9BB07A; --rail:#5B6475; --tree:#3F8A4F; --car:#2457D6; --car2:#1B44AD; --win:#CFE0FF;
  --f-display:"Rubik","Segoe UI",system-ui,sans-serif;
  --f-body:"PT Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1422; --grid:rgba(110,149,255,.07); --surface:#161F33; --surface2:#1D2842;
  --ink:#E3E9F5; --muted:#9AA6C0; --line:#2A3654;
  --accent:#6E95FF; --accent-ink:#0B1020; --vec:#FF8A3D;
  --ok:#5BD08B; --ok-bg:#16301F; --bad:#FF7A7A; --bad-bg:#3A1A1E;
  --sky:#18233B; --ground:#3F5133; --rail:#8792A8; --tree:#4FA562; --car:#4C77F0; --car2:#3459C9; --win:#F7D774;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1422; --grid:rgba(110,149,255,.07); --surface:#161F33; --surface2:#1D2842;
  --ink:#E3E9F5; --muted:#9AA6C0; --line:#2A3654;
  --accent:#6E95FF; --accent-ink:#0B1020; --vec:#FF8A3D;
  --ok:#5BD08B; --ok-bg:#16301F; --bad:#FF7A7A; --bad-bg:#3A1A1E;
  --sky:#18233B; --ground:#3F5133; --rail:#8792A8; --tree:#4FA562; --car:#4C77F0; --car2:#3459C9; --win:#F7D774;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
p{margin:0}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:0 auto;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.badge{font-family:var(--f-mono);font-size:13px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:4px 8px;white-space:nowrap}
.brand b{font-family:var(--f-display);font-weight:700;font-size:16px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:none;border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round}

/* hero */
.hero{padding-block:32px 20px;display:grid;gap:10px}
.eyebrow{font-family:var(--f-mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.hero h1{font-size:clamp(30px,5.5vw,52px);font-weight:800;letter-spacing:-.01em}
.hero p{color:var(--muted);max-width:62ch}

/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-block:8px 22px;border-bottom:2px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 14px;font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs .n{font-family:var(--f-mono);font-size:12px;opacity:.7;margin-right:6px}

/* theory */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:18px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:12px;align-content:start;min-width:0}
.block h2{font-size:21px;font-weight:700}
.def{border-left:3px solid var(--accent);padding-left:12px}
.ex{color:var(--muted);font-style:italic}
dl.terms{margin:0;display:grid;gap:10px}
dl.terms div{display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
dl.terms dt{font-weight:700}
dl.terms dd{margin:0;color:var(--ink)}
.sym{font-family:var(--f-mono);font-weight:700;color:var(--accent)}
.formula{font-family:var(--f-mono);font-size:clamp(22px,4vw,30px);font-weight:700;text-align:center;padding:14px;border-radius:10px;background:var(--surface2);letter-spacing:.02em}
.formula small{display:block;font-size:14px;font-weight:500;color:var(--muted);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--f-mono);font-size:14px;background:var(--surface2);border-radius:999px;padding:4px 12px;font-variant-numeric:tabular-nums}
.svgbox{background:var(--surface2);border-radius:10px;padding:8px;overflow-x:auto}
.svgbox svg{display:block;width:100%;height:auto;min-width:300px}
.svgbox text{font-family:var(--f-body);font-size:14px;fill:var(--ink)}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.types div{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:15px}
.types b{display:block;font-family:var(--f-display);font-size:14px;color:var(--accent);margin-bottom:2px}

/* sim */
.simcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:16px}
.simhead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.simhead h2{font-size:22px}
.frames{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.frames span{font-weight:700;font-size:15px;color:var(--muted)}
.frames button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer}
.frames button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.canvasbox{border-radius:12px;overflow:hidden;border:1px solid var(--line)}
canvas{display:block;width:100%;height:240px}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px;align-items:end}
.ctl{display:grid;gap:6px;min-width:0}
.ctl label{font-weight:700;font-size:15px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ctl output{font-family:var(--f-mono);color:var(--vec);font-variant-numeric:tabular-nums}
.ctl small{color:var(--muted);font-size:13px}
input[type=range]{width:100%;accent-color:var(--accent)}
.btn{border:0;border-radius:10px;padding:10px 18px;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer;font-family:var(--f-display)}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;min-width:420px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left}
th{font-family:var(--f-display);font-size:14px;color:var(--muted);font-weight:700}
td.v{font-family:var(--f-mono)}
td.hl,th.hl{background:var(--surface2)}
.rest{color:var(--ok);font-weight:700}
.concl{background:var(--surface2);border-radius:10px;padding:12px 14px}

/* calculator */
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{display:grid;gap:4px}
.field label{font-weight:700;font-size:15px}
.field .row input{flex:1 1 120px;min-width:0}
input[type=number],select{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-family:var(--f-mono)}
.solution{font-family:var(--f-mono);font-size:15px;background:var(--surface2);border-radius:10px;padding:14px;display:grid;gap:6px;overflow-wrap:anywhere}
.solution .ans{font-weight:700;color:var(--accent);font-size:17px}
.err{color:var(--bad)}

/* quiz */
.quiz{max-width:760px}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.progress{flex:1 1 200px;height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qnum{font-family:var(--f-mono);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.qtext{font-size:20px;font-family:var(--f-display);font-weight:500;line-height:1.35}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);font-weight:700;color:var(--accent);flex:none}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.feedback{border-radius:10px;padding:12px 14px}
.feedback.good{background:var(--ok-bg)} .feedback.bad{background:var(--bad-bg)}
.feedback b{display:block}
.score{font-size:46px;font-family:var(--f-display);font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}


/* step-by-step screens */
.wrap{padding-block:0 110px}
.screen{min-height:calc(100dvh - 160px);display:grid;align-content:center;justify-items:center;padding-block:28px;animation:rise .45s ease both}
.screen > *{width:100%;max-width:780px;min-width:0}
.screen.wide > *{max-width:1080px}
.screen .block{padding:clamp(20px,4vw,36px);gap:16px;font-size:18px}
.screen .block h2{font-size:clamp(24px,3.6vw,32px)}
@keyframes rise{from{opacity:.15;transform:translateY(16px)}to{opacity:1;transform:none}}
.cover{min-height:calc(100dvh - 70px)}
.coverin{display:grid;gap:22px;max-width:820px}
.cover h1{font-size:clamp(34px,6.5vw,64px);font-weight:800;letter-spacing:-.015em}
.cover .lead{font-size:clamp(17px,2.2vw,20px);color:var(--muted);max-width:60ch}
.plan{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.plan li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;font-family:var(--f-display);font-weight:700;display:flex;gap:10px;align-items:center}
.plan .n{font-family:var(--f-mono);width:28px;height:28px;border-radius:50%;background:var(--surface2);color:var(--accent);display:grid;place-items:center;font-size:14px;flex:none}
.btn.big{font-size:19px;padding:14px 28px;border-radius:12px}
.foot{color:var(--muted);font-size:14px}
.stepper{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.stepin{max-width:1080px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.where{flex:1;display:grid;justify-items:center;gap:6px;min-width:0}
#secName{font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dots button{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:var(--line);cursor:pointer}
.dots button[aria-current="step"]{background:var(--accent);width:26px;border-radius:99px}
.btn:disabled{opacity:.4;cursor:default}
@media (max-width:480px){.stepin .btn{padding:10px 12px;font-size:14px}}
footer{margin-top:36px;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* ===== projector scale: full width, large type ===== */
body{font-size:clamp(18px,1.1vw + 9px,28px)}
.wrap{max-width:none;padding-inline:clamp(16px,3vw,64px)}
.bar,.stepin{max-width:none;padding-inline:clamp(16px,3vw,64px)}
.badge{font-size:clamp(13px,.6vw + 8px,20px);padding:.3em .6em}
.brand b{font-size:clamp(16px,.9vw + 8px,26px)}
.seg button{font-size:clamp(14px,.7vw + 8px,22px);padding:.35em .9em}
.iconbtn{width:clamp(38px,2.6vw + 10px,56px);height:clamp(38px,2.6vw + 10px,56px)}
.iconbtn svg{width:55%;height:55%}
.screen{min-height:calc(100dvh - clamp(150px,10vw + 60px,240px))}
.screen > *,.screen.wide > *{max-width:none}
.eyebrow{font-size:clamp(13px,.7vw + 8px,22px)}
.screen .block{font-size:clamp(19px,1.35vw + 8px,34px);line-height:1.45;gap:clamp(14px,1.4vw,28px)}
.screen .block h2,.simhead h2{font-size:clamp(26px,2.6vw + 10px,62px)}
.cover h1{font-size:clamp(36px,4.6vw + 14px,104px)}
.cover .lead{font-size:clamp(18px,1.4vw + 8px,34px);max-width:52ch}
.coverin{max-width:none;gap:clamp(18px,2vw,40px)}
.plan li{font-size:clamp(17px,1.1vw + 8px,30px);padding:clamp(12px,1.2vw,24px)}
.plan .n{width:1.6em;height:1.6em;font-size:.8em}
.btn{font-size:clamp(16px,.9vw + 8px,26px);padding:.55em 1.1em}
.btn.big{font-size:clamp(19px,1.2vw + 10px,34px)}
.foot{font-size:clamp(14px,.6vw + 8px,20px)}
.types div{font-size:inherit;padding:.6em .8em}
.types b{font-size:.8em}
.formula{font-size:clamp(30px,3.4vw + 10px,84px);padding:.5em}
.formula small{font-size:.42em}
.chip{font-size:clamp(15px,.9vw + 8px,28px)}
.svgbox svg{max-height:58vh}
.svgbox text{font-size:15px}
.frames span,.frames button{font-size:clamp(16px,1vw + 8px,28px)}
.frames button{padding:.35em .9em}
.ctl label{font-size:clamp(16px,.9vw + 8px,26px)}
.ctl small{font-size:clamp(13px,.6vw + 8px,20px)}
input[type=range]{height:clamp(20px,1.5vw,36px)}
canvas{height:clamp(260px,40vh,560px)}
table{font-size:clamp(16px,1vw + 8px,28px)}
th{font-size:.8em}
.concl{font-size:clamp(17px,1vw + 8px,28px)}
.field label{font-size:clamp(16px,.9vw + 8px,26px)}
input[type=number],select{font-size:clamp(17px,1vw + 8px,28px);padding:.35em .5em}
.solution{font-size:clamp(16px,1vw + 8px,28px)}
.solution .ans{font-size:1.12em}
.quiz{max-width:none}
.qtext{font-size:clamp(22px,1.9vw + 8px,48px)}
.qnum{font-size:clamp(15px,.8vw + 8px,24px)}
.progress{height:clamp(8px,.6vw,14px)}
.opt{padding:.6em .8em;font-size:clamp(18px,1.3vw + 8px,34px)}
.feedback{font-size:clamp(17px,1.1vw + 8px,30px)}
.score{font-size:clamp(46px,6vw,140px)}
#secName{font-size:clamp(14px,.8vw + 8px,24px)}
.dots button{width:clamp(10px,.7vw,16px);height:clamp(10px,.7vw,16px)}
.dots button[aria-current="step"]{width:clamp(26px,2vw,44px)}
@media (min-width:1000px){
  .screen:not(.wide) .block:has(.svgbox),.screen:not(.wide) .block:has(.formula){grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:clamp(24px,3vw,72px);align-items:center}
  .screen:not(.wide) .block:has(.svgbox) > *,.screen:not(.wide) .block:has(.formula) > *{grid-column:1}
  .screen:not(.wide) .block .svgbox,.screen:not(.wide) .block .formula{grid-column:2;grid-row:1 / span 8}
}

/* problem question + functional literacy */
.prob{display:grid;gap:clamp(14px,1.6vw,30px)}
.prob .tag{display:inline-flex;align-items:center;gap:.4em;font-family:var(--f-mono);font-weight:700;font-size:clamp(13px,.7vw + 8px,22px);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.prob .bigq{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,2.8vw + 10px,64px);line-height:1.2;text-wrap:balance}
.prob .sit{color:var(--muted)}
.hyps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:10px}
.hyp{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:.6em .8em;cursor:pointer;display:flex;gap:.6em;align-items:flex-start;font-size:inherit}
.hyp .k{font-family:var(--f-mono);font-weight:700;color:var(--accent);flex:none}
.hyp[aria-pressed="true"]{border-color:var(--accent);background:var(--surface2)}
.reveal{border-radius:12px;padding:.8em 1em;background:var(--ok-bg);border-left:5px solid var(--ok)}
.muted{color:var(--muted)}
.fg{display:grid;gap:clamp(14px,1.6vw,28px)}
.ctx{background:var(--surface2);border-radius:12px;padding:clamp(12px,1.4vw,26px);display:grid;gap:.6em}
.ctx table{font-size:.9em}
.tasks{display:grid;gap:clamp(12px,1.4vw,24px)}
.task{border:1.5px solid var(--line);border-radius:12px;padding:clamp(12px,1.4vw,24px);display:grid;gap:.6em}
.task .tn{font-family:var(--f-mono);font-weight:700;color:var(--accent);font-size:.75em;text-transform:uppercase;letter-spacing:.06em}
.task .tq{font-weight:700}
.ansrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ansrow input{width:min(100%,220px);border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:.3em .5em;font-family:var(--f-mono);font-size:inherit}
.ansrow .unit{font-family:var(--f-mono);font-weight:700}
.task textarea{width:100%;min-height:4.5em;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:.5em;font:inherit;color:inherit;resize:vertical}
.fb{border-radius:10px;padding:.5em .8em}
.fb.good{background:var(--ok-bg)} .fb.bad{background:var(--bad-bg)}
.fb.info{background:var(--surface2)}
.task .opt{font-size:inherit}
</style>
</head>
<body>


<header>
  <div class="bar">
    <div class="brand"><span class="badge">7 · ФИЗ</span><b data-i18n="brand"></b></div>
    <div class="seg" role="group" aria-label="Язык / Тіл">
      <button id="lang-ru" aria-pressed="true">РУС</button>
      <button id="lang-kz" aria-pressed="false">ҚАЗ</button>
    </div>
    <button class="iconbtn" id="themeBtn" aria-label="Тема"></button>
  </div>
</header>

<div class="wrap">
<main id="steps">
  <section class="screen cover" data-step data-sec="cover">
    <div class="coverin">
      <span class="eyebrow" data-i18n="eyebrow"></span>
      <h1 data-i18n="title"></h1>
      <p class="lead" data-i18n="lead"></p>
      <ol class="plan">
        <li><span class="n">1</span><span data-i18n="sec0"></span></li>
        <li><span class="n">2</span><span data-i18n="tab1"></span></li>
        <li><span class="n">3</span><span data-i18n="tab2"></span></li>
        <li><span class="n">4</span><span data-i18n="tab3"></span></li>

let lang="ru";
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- i18n ---------- */
function applyLang(){
  document.documentElement.lang = lang==="ru"?"ru":"kk";
  document.querySelectorAll("[data-i18n]").forEach(el=>{const v=L()[el.dataset.i18n]; if(typeof v==="string") el.textContent=v;});
  document.querySelectorAll("[data-i18n-html]").forEach(el=>{el.innerHTML=L()[el.dataset.i18nHtml];});
  document.querySelectorAll("[data-u]").forEach(el=>{el.textContent=L().u[el.dataset.u];});
  document.querySelectorAll("[data-u-label]").forEach(el=>{el.textContent=L().d5t+", "+L().u[el.dataset.uLabel];});
  document.getElementById("lang-ru").setAttribute("aria-pressed",lang==="ru");
  document.getElementById("lang-kz").setAttribute("aria-pressed",lang==="kz");
  updatePlay(); updateSimText(); calc(); renderQuiz(); updateStepper();
}
document.getElementById("lang-ru").onclick=()=>{lang="ru";store.set("lang",lang);applyLang();};
document.getElementById("lang-kz").onclick=()=>{lang="kz";store.set("lang",lang);applyLang();};

function isDark(){const t=document.documentElement.dataset.theme; return t? t==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;}
function paintThemeBtn(){const b=document.getElementById("themeBtn"); b.innerHTML=isDark()?sun:moon; b.title=isDark()?"Светлая / Жарық":"Тёмная / Қараңғы";}

/* ---------- steps ---------- */
const screens=[...document.querySelectorAll("[data-step]")];
let cur=0;
function updateStepper(){
  const l=L(), n=screens.length-1;
  document.getElementById("prevBtn").textContent=l.back;
  document.getElementById("nextBtn").textContent=l.fwd;
  document.getElementById("prevBtn").disabled = cur<=1;
  document.getElementById("nextBtn").disabled = cur>=n;
  document.getElementById("secName").textContent = cur>0 ? `${l[screens[cur].dataset.sec]} · ${l.stepOf} ${cur}/${n}` : "";
  const d=document.getElementById("dots");
  if(d.children.length!==n){ d.innerHTML=""; for(let i=1;i<=n;i++){const b=document.createElement("button"); b.setAttribute("aria-label",String(i)); b.onclick=()=>showStep(i); d.appendChild(b);} }
  [...d.children].forEach((b,i)=> i+1===cur ? b.setAttribute("aria-current","step") : b.removeAttribute("aria-current"));
}
function showStep(i){
  cur=Math.max(0,Math.min(screens.length-1,i));
  screens.forEach((s,k)=>{s.hidden = k!==cur;});
  document.getElementById("stepper").hidden = cur===0;
  if(screens[cur].id==="p-sim") resize();
  updateStepper();
  window.scrollTo({top:0});
}
document.getElementById("startBtn").onclick=()=>showStep(1);
document.getElementById("prevBtn").onclick=()=>showStep(cur-1);
document.getElementById("nextBtn").onclick=()=>showStep(cur+1);
document.getElementById("toSim").onclick=()=>showStep(screens.indexOf(document.getElementById("p-sim")));
document.addEventListener("keydown",e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if(e.key==="ArrowRight"&&cur>0) showStep(cur+1);
  if(e.key==="ArrowLeft"&&cur>1) showStep(cur-1);
});

/* ---------- simulation ---------- */
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
let W=800,H=240,dpr=1, C={};
let frame="ground", running=true, trainX=0, p=0, last=null;
const vtEl=document.getElementById("vt"), vpEl=document.getElementById("vp");
function readColors(){const s=getComputedStyle(document.documentElement); ["sky","ground","rail","tree","car","car2","win","ink","muted","vec","accent","surface"].forEach(k=>C[k]=s.getPropertyValue("--"+k).trim());}
function resize(){const r=cv.getBoundingClientRect(); if(!r.width) return; dpr=window.devicePixelRatio||1; const sc=r.height/240; W=r.width/sc; H=240; cv.width=r.width*dpr; cv.height=r.height*dpr; ctx.setTransform(dpr*sc,0,0,dpr*sc,0,0);}
window.addEventListener("resize",resize);
const carW=()=>Math.min(170,Math.max(100,W/3.4));
const kpx=()=>W/110; // pixels per second per km/h
const mod=(a,n)=>((a%n)+n)%n;

function arrow(x,y,v){ // v in km/h relative to frame
  if(Math.abs(v)<0.01) { ctx.fillStyle=C.vec; ctx.beginPath(); ctx.arc(x,y,4,0,7); ctx.fill(); return; }
  const len=Math.sign(v)*Math.min(140,8+Math.abs(v)*1.1);
  ctx.strokeStyle=C.vec; ctx.fillStyle=C.vec; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+len-Math.sign(v)*8,y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+len,y); ctx.lineTo(x+len-Math.sign(v)*10,y-6); ctx.lineTo(x+len-Math.sign(v)*10,y+6); ctx.fill();
}
function drawTree(x,gy){
  ctx.fillStyle=C.rail; ctx.fillRect(x-3,gy-26,6,26);
  ctx.fillStyle=C.tree; ctx.beginPath(); ctx.moveTo(x,gy-80); ctx.lineTo(x-20,gy-22); ctx.lineTo(x+20,gy-22); ctx.fill();
}
function drawTrain(x,gy){
  const cw=carW(), n=3, h=58, y=gy-12-h;
  for(let i=0;i<n;i++){
    const cx=x+i*cw;
    ctx.fillStyle = i===n-1? C.car2 : C.car;
    if(i===n-1){ ctx.beginPath(); ctx.moveTo(cx+3,y); ctx.lineTo(cx+cw-28,y); ctx.quadraticCurveTo(cx+cw,y+8,cx+cw,y+h); ctx.lineTo(cx+3,y+h); ctx.fill(); }
    else { ctx.beginPath(); ctx.roundRect(cx+3,y,cw-6,h,6); ctx.fill(); }
    ctx.fillStyle=C.win;
    const wn = i===n-1?2:3;
    for(let w=0;w<wn;w++) ctx.fillRect(cx+14+w*(cw-28)/3, y+10, (cw-28)/3-10, 18);
    ctx.fillStyle=C.ink;
    [cx+22,cx+cw-22].forEach(wx=>{ctx.beginPath();ctx.arc(wx,gy-8,8,0,7);ctx.fill();});
  }
  return {y,h,len:n*cw};
}
function drawPassenger(x,y){
  ctx.fillStyle=C.vec; ctx.strokeStyle=C.vec; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(x,y+12,6,0,7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x,y+18); ctx.lineTo(x,y+36); ctx.moveTo(x,y+36); ctx.lineTo(x-6,y+50); ctx.moveTo(x,y+36); ctx.lineTo(x+6,y+50); ctx.moveTo(x-7,y+25); ctx.lineTo(x+7,y+25); ctx.stroke();
}
function velGround(){const vt=+vtEl.value, vp=+vpEl.value; return {tree:0,train:vt,pass:vt+vp};}

function draw(){
  const gy=H-52, cw=carW(), tl=3*cw;
  const vg=velGround();
  const passWorld = trainX + cw + p; // passenger lives in the middle car
  let cam;
  if(frame==="ground") cam=0;
  else if(frame==="train") cam = trainX - (W-tl)/2;
  else cam = passWorld - W/2;
  ctx.fillStyle=C.sky; ctx.fillRect(0,0,W,H);
  ctx.fillStyle=C.ground; ctx.fillRect(0,gy,W,H-gy);
  // trees (periodic, fixed to ground)
  const S=Math.max(140,W/4.5);
  const off=mod(-cam,S);
  for(let x=off-S;x<W+S;x+=S) drawTree(x+S/2,gy);
  // rail
  ctx.fillStyle=C.rail; ctx.fillRect(0,gy-2,W,4);
  ctx.strokeStyle=C.rail; ctx.lineWidth=2;
  for(let x=mod(-cam,24)-24;x<W;x+=24){ctx.beginPath();ctx.moveTo(x,gy+2);ctx.lineTo(x+10,gy+8);ctx.stroke();}
  // train (wrap in ground frame)
  let tx = trainX - cam;
  if(frame==="ground") tx = mod(tx+tl, W+tl) - tl;
  const tr=drawTrain(tx,gy);
  const px = tx + cw + p;
  drawPassenger(px, tr.y+2);
  // velocity arrows relative to frame
  const fv = frame==="ground"?0: frame==="train"? vg.train : vg.pass;
  const tree1 = off - S + S/2 + S*Math.ceil((W*0.12 - (off-S+S/2))/S);
  arrow(tree1, gy-92, vg.tree-fv);
  arrow(tx+tl*0.82, tr.y-14, vg.train-fv);
  arrow(px, tr.y-14+ (Math.abs(px-(tx+tl*0.82))<60? -16:0), vg.pass-fv);
  // x-axis attached to reference body
  const ax = frame==="ground"? 24 : frame==="train"? tx : px;
  const ay=H-16;
  ctx.strokeStyle=C.ink; ctx.fillStyle=C.ink; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(4,ay); ctx.lineTo(W-14,ay); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W-4,ay); ctx.lineTo(W-16,ay-5); ctx.lineTo(W-16,ay+5); ctx.fill();
  ctx.font="600 13px 'JetBrains Mono', monospace";
  for(let i=-30;i<=30;i++){ const x=ax+i*50; if(x<6||x>W-20) continue; ctx.beginPath(); ctx.moveTo(x,ay-(i===0?7:4)); ctx.lineTo(x,ay+(i===0?7:4)); ctx.stroke(); }
  if(ax>4&&ax<W-20){ctx.fillText("0",ax-4,ay-10);}
  ctx.fillText("x",W-14,ay-10);
}
function step(ts){
  if(last===null) last=ts;
  const dt=Math.min(0.05,(ts-last)/1000); last=ts;
  if(running && !document.getElementById("p-sim").hidden){
    const k=kpx(), cw=carW();
    trainX += (+vtEl.value)*k*dt;
    p += (+vpEl.value)*k*dt*3; // pedestrian speed shown 3× for visibility inside car
    p = mod(p-12, cw-24)+12;
  }
  if(!document.getElementById("p-sim").hidden) draw();
  requestAnimationFrame(step);
}

/* ---------- calculator ---------- */
const $=id=>document.getElementById(id);
function calc(){
  const l=L(), u=l.u, mode=$("mode").value;
  $("fS").hidden = mode==="s"; $("fT").hidden = mode==="t"; $("fV").hidden = mode==="v";
  const sv=+$("sVal").value, tv=+$("tVal").value, vv=+$("vVal").value;
  const su=$("sUnit"), tu=$("tUnit"), vu=$("vUnit");
  const sName=u[su.selectedOptions[0].dataset.u], tName=u[tu.selectedOptions[0].dataset.u], vName=u[vu.selectedOptions[0].dataset.u];
  const S=sv*+su.value, Tt=tv*+tu.value, V=vv*(vu.value==="1"?1:1/3.6);
  const need = mode==="v"?[sv,tv]: mode==="s"?[vv,tv]:[sv,vv];
  if(need.some(x=>!(x>0))){ $("solution").innerHTML=`<span class="err">${l.errIn}</span>`; return; }
  const conv=(val,name,si,siName)=> name===siName? `${fmt(val,3)} ${name}` : `${fmt(val,3)} ${name} = ${fmt(si,3)} ${siName}`;
  const gS=`s = ${conv(sv,sName,S,u.m)}`, gT=`t = ${conv(tv,tName,Tt,u.s)}`, gV=`v = ${conv(vv,vName,V,u.ms)}`;
  let given, sol, ans;
  if(mode==="v"){ const r=S/Tt; given=[gS,gT]; sol=`v = s / t = ${fmt(S,3)} ${u.m} / ${fmt(Tt,3)} ${u.s} = ${fmt(r,3)} ${u.ms}`; ans=`v = ${fmt(r,3)} ${u.ms} (${fmt(r*3.6,2)} ${u.kmh})`; }
  else if(mode==="s"){ const r=V*Tt; given=[gV,gT]; sol=`s = v · t = ${fmt(V,3)} ${u.ms} · ${fmt(Tt,3)} ${u.s} = ${fmt(r,3)} ${u.m}`; ans=`s = ${fmt(r,3)} ${u.m}`+(r>=1000?` (${fmt(r/1000,3)} ${u.km})`:""); }
  else { const r=S/V; given=[gS,gV]; sol=`t = s / v = ${fmt(S,3)} ${u.m} / ${fmt(V,3)} ${u.ms} = ${fmt(r,3)} ${u.s}`; ans=`t = ${fmt(r,3)} ${u.s}`+(r>=60?` (${fmt(r/60,2)} ${u.min})`:""); }
  $("solution").innerHTML=`<div><b>${l.given}</b> ${given.join("; ")}</div><div><b>${l.sol}</b> ${sol}</div><div class="ans">${l.ans} ${ans}</div>`;
}
["mode","sVal","tVal","vVal","sUnit","tUnit","vUnit"].forEach(id=>$(id).addEventListener("input",calc));

let qi=0, score=0, answered=null;
function renderQuiz(){
  const l=L(), box=$("quizBox");
  if(qi>=Q.length){
    box.innerHTML=`<h2>${l.res}</h2><div class="score">${score} ${l.of} ${Q.length}</div><p>${l.grade(score)}</p><div><button class="btn" id="qAgain">${l.again}</button></div>`;
    $("qAgain").onclick=()=>{qi=0;score=0;answered=null;renderQuiz();};
    return;
  }
  const q=Q[qi], [text,opts,expl]=q[lang];
  let h=`<div class="qtop"><span class="qnum">${l.qOf} ${qi+1} / ${Q.length}</span><div class="progress"><i style="width:${(qi/Q.length)*100}%"></i></div></div>
  <p class="qtext">${text}</p><div class="opts">`;
  opts.forEach((o,i)=>{
    let cls=""; if(answered!==null){ if(i===q.a) cls="right"; else if(i===answered) cls="wrong"; }
    h+=`<button class="opt ${cls}" data-i="${i}" ${answered!==null?"disabled":""}><span class="k">${"АБВГ"[i]}</span><span>${o}</span></button>`;
  });
  h+="</div>";
  if(answered!==null){
    const ok=answered===q.a;
    h+=`<div class="feedback ${ok?"good":"bad"}"><b>${ok?l.right:l.wrong}</b>${expl}</div><div><button class="btn" id="qNext">${qi===Q.length-1?l.finish:l.next}</button></div>`;
  }
  box.innerHTML=h;
  box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{answered=+b.dataset.i; if(answered===q.a) score++; renderQuiz(); $("qNext").focus();});
  if(answered!==null) $("qNext").onclick=()=>{qi++; answered=null; renderQuiz();};
}

    } else {
      h+=`<textarea id="fgTa${i}" placeholder="${l.writeHere}">${st.text??""}</textarea><div><button class="btn ghost" data-sample="${i}">${l.sample}</button></div>`;
      if(st.sample) h+=`<div class="fb info"><b>${l.sampleLbl}</b> ${t.sample}</div>`;
    }
    h+=`</div>`;
  });
  box.innerHTML=h+"</div>";
  f.tasks.forEach((t,i)=>{
    const inp=$("fgIn"+i); if(inp) inp.oninput=()=>{fgState[i].val=inp.value;};
    const ta=$("fgTa"+i); if(ta) ta.oninput=()=>{fgState[i].text=ta.value;};
  });
  box.querySelectorAll("[data-check]").forEach(b=>b.onclick=()=>{const i=+b.dataset.check, t=FG[lang].tasks[i], v=parseFloat(String($("fgIn"+i).value).replace(",","."));
    fgState[i].val=$("fgIn"+i).value; fgState[i].res = (!isNaN(v) && Math.abs(v-t.ans)<=Math.max(t.tol??0.02*Math.abs(t.ans),1e-9))?"good":"bad"; renderFG();});
  box.querySelectorAll("[data-sol]").forEach(b=>b.onclick=()=>{fgState[+b.dataset.sol].sol=true; renderFG();});
  box.querySelectorAll("[data-task]").forEach(b=>b.onclick=()=>{fgState[+b.dataset.task].pick=+b.dataset.j; renderFG();});
  box.querySelectorAll("[data-sample]").forEach(b=>b.onclick=()=>{fgState[+b.dataset.sample].sample=!fgState[+b.dataset.sample].sample; renderFG();});
}
const _applyLang0=applyLang;
applyLang=function(){_applyLang0(); renderProb(); renderFG(); renderQuizExtra();};
const _renderQuiz0=renderQuiz;
function renderQuizExtra(){
  if(qi>=Q.length && !$("qBack")){
    const d=document.createElement("div"); d.innerHTML=`<button class="btn ghost" id="qBack">${L().backToProb}</button>`;
    $("quizBox").appendChild(d);
    $("qBack").onclick=()=>{probOpen=true; renderProb(); showStep(screens.indexOf($("p-prob")));};
  }
}
renderQuiz=function(){_renderQuiz0(); renderQuizExtra();};

/* ---------- init ---------- */
const savedTheme=store.get("theme"); if(savedTheme) document.documentElement.dataset.theme=savedTheme;
const savedLang=store.get("lang"); if(savedLang==="kz"||savedLang==="ru") lang=savedLang;
paintThemeBtn(); readColors();
applyLang();
showStep(0);
resize(); trainX=W*0.15; p=20;
requestAnimationFrame(step);
</script>
